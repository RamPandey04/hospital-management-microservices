server:
  port: 8083

spring:
  application:
    name: DOCTOR-SERVICE



  datasource:
    url: jdbc:postgresql://localhost:5432/doctordb
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/